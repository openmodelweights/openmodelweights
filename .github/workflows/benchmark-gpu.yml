name: Run reproducible GPU benchmark

on:
  workflow_dispatch:
    inputs:
      model_id:
        description: Open Model Weights model id
        required: true
        default: qwen-qwen2-5-1-5b-instruct
      repository:
        description: Optional Hugging Face owner/name override
        required: false
        default: ""
      dtype:
        description: vLLM dtype / precision selector
        required: true
        default: auto
      tensor_parallel_size:
        description: Number of GPUs used by vLLM
        required: true
        default: "1"
      vllm_spec:
        description: pip package spec recorded by the run (for example vllm or vllm==X.Y.Z)
        required: true
        default: vllm

permissions:
  contents: write

concurrency:
  group: omw-gpu-benchmark
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: omw-gpu
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Confirm GPU
        run: |
          nvidia-smi
          python - <<'PY'
          import shutil
          assert shutil.which("nvidia-smi"), "nvidia-smi missing"
          PY

      - name: Install benchmark runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install "${{ inputs.vllm_spec }}"
          python -m pip install -r benchmarks/runner/requirements.txt

      - name: Run OMW deployment benchmark
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          args=(
            --model-id "${{ inputs.model_id }}"
            --dtype "${{ inputs.dtype }}"
            --tensor-parallel-size "${{ inputs.tensor_parallel_size }}"
            --write-repo
          )
          if [ -n "${{ inputs.repository }}" ]; then
            args+=(--repository "${{ inputs.repository }}")
          fi
          python benchmarks/runner/omw_vllm_benchmark.py "${args[@]}"

      - name: Validate benchmark result
        run: python scripts/validate_benchmarks.py

      - name: Commit accepted measurement
        run: |
          git config user.name "openmodelweights-benchmark-bot"
          git config user.email "openmodelweights-benchmark-bot@users.noreply.github.com"
          git add data/benchmark-results.json data/benchmark-evidence
          git commit -m "Add reproducible GPU benchmark: ${{ inputs.model_id }}"
          git pull --rebase origin main
          git push

      - name: Upload raw run artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: omw-benchmark-${{ inputs.model_id }}-${{ github.run_id }}
          path: |
            benchmark-output/
            data/benchmark-evidence/
          if-no-files-found: warn
          retention-days: 90
