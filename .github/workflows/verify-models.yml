name: Verify model registry

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"
  push:
    paths:
      - "scripts/verify_models.py"
      - "scripts/refine_registry.py"
      - "data/models-source.json"
      - ".github/workflows/verify-models.yml"

permissions:
  contents: write

concurrency:
  group: verify-model-registry
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install verifier dependencies
        run: python -m pip install --disable-pip-version-check requests pyyaml

      - name: Verify all model records
        run: python scripts/verify_models.py

      - name: Refine licenses, precision evidence and render final pages
        run: python scripts/refine_registry.py

      - name: Commit verified data
        run: |
          git config user.name "openmodelweights-bot"
          git config user.email "openmodelweights-bot@users.noreply.github.com"
          git add public/index.html public/registry.json public/registry.schema.json public/llms.txt public/models public/developers public/verification public/explore public/licenses public/hardware public/formats public/lineage public/changes public/changes.json public/sitemap.xml data/verification-report.json data/change-feed.json
          if git diff --cached --quiet; then
            echo "No verification changes."
          else
            git commit -m "Verify model fields against primary sources [skip ci]"
            git push
          fi
