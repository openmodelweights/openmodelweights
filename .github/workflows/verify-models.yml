name: Verify model registry

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"
  push:
    paths:
      - "scripts/discover_models.py"
      - "scripts/verify_models.py"
      - "scripts/refine_registry.py"
      - "scripts/render_extras.py"
      - "scripts/render_product.py"
      - "scripts/build_intelligence.py"
      - "scripts/validate_benchmarks.py"
      - "benchmarks/runner/**"
      - "data/benchmark-evidence/**"
      - "src/worker.js"
      - "package.json"
      - "wrangler.jsonc"
      - "data/benchmark-results.json"
      - "data/models-source.json"
      - ".github/workflows/verify-models.yml"

permissions:
  contents: write

concurrency:
  group: verify-model-registry
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install verifier dependencies
        run: python -m pip install --disable-pip-version-check requests pyyaml huggingface_hub

      - name: Discover registry candidates
        env:
          OMW_TARGET_MODELS: "700"
          OMW_DISCOVERY_BUFFER: "120"
        run: python scripts/discover_models.py

      - name: Verify all model records
        env:
          OMW_TARGET_MODELS: "700"
        run: python scripts/verify_models.py

      - name: Refine licenses, precision evidence and render final pages
        run: python scripts/refine_registry.py

      - name: Render comparison and developer metadata
        run: python scripts/render_extras.py

      - name: Render mature product surfaces
        run: python scripts/render_product.py

      - name: Validate benchmark evidence and runner
        run: |
          python -m py_compile benchmarks/runner/omw_vllm_benchmark.py
          python scripts/validate_benchmarks.py

      - name: Build evidence intelligence layer
        run: python scripts/build_intelligence.py

      - name: Validate MCP Worker bundle
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npx wrangler deploy --dry-run --outdir .wrangler-dry-run

      - name: Commit verified data
        run: |
          git config user.name "openmodelweights-bot"
          git config user.email "openmodelweights-bot@users.noreply.github.com"
          git add data/models-source.json data/verification-report.json data/change-feed.json data/evidence-ledger data/evidence-runs data/benchmark-results.json public
          if git diff --cached --quiet; then
            echo "No verification changes."
          else
            git commit -m "Verify model fields against primary sources [skip ci]"
            git push
          fi
